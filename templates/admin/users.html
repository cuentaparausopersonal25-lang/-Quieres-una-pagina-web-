{% extends 'admin/base_admin.html' %}{% block admin_content %}<h1>Usuarios</h1><div class="table-wrap"><table><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Registro</th></tr>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ 'Administrador' if u.is_admin else 'Cliente' }}</td><td>{{ u.created_at.strftime('%d/%m/%Y') }}</td></tr>{% endfor %}</table></div>{% endblock %}
