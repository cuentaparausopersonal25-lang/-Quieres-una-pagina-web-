{% extends 'admin/base_admin.html' %}{% block admin_content %}<h1>Categorías</h1><form method="post" class="panel-form admin-create"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Nueva categoría</h2><label>Nombre<input name="name" required></label><label>Descripción<input name="description"></label><button class="btn primary">Crear</button></form><div class="panel-form">{% for c in categories %}<p><b>{{ c.name }}</b> — {{ c.description }}</p>{% endfor %}</div>{% endblock %}
