{% extends 'admin/base_admin.html' %}{% block admin_content %}<h1>Modelos</h1><form method="post" class="panel-form admin-create"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Crear modelo</h2><label>Nombre<input name="name" required></label><label>Categoría<select name="category_id">{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><label>Precio en pesos<input type="number" name="price" min="0" value="45000"></label><label>Descripción<textarea name="description"></textarea></label><label>Características<input name="features"></label><label>Color de acento<input type="color" name="accent" value="#2878e8"></label><button class="btn primary">Crear modelo</button></form><div class="table-wrap"><table><tr><th>Modelo</th><th>Categoría</th><th>Precio</th><th>Acción</th></tr>{% for m in models %}<tr><td>{{ m.name }}</td><td>{{ m.category.name }}</td><td>{{ money(m.price) }}</td><td><a href="{{ url_for('demo',slug=m.slug) }}">Ver</a> <form class="inline" method="post" action="{{ url_for('delete_model',model_id=m.id) }}" onsubmit="return confirm('¿Eliminar este modelo?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger-link">Eliminar</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
